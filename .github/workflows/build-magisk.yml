name: Build Android Magisk module

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'magisk/**'
      - '.github/workflows/build-magisk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          check-latest: true

      - name: Test host build
        run: go test ./...

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Build Android arm64 binaries (CGO, system resolver)
        run: |
          set -eux
          mkdir -p out/bin

          NDK="${{ steps.ndk.outputs.ndk-path }}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          API=24
          export CC="$TOOLCHAIN/bin/aarch64-linux-android${API}-clang"
          export CXX="$TOOLCHAIN/bin/aarch64-linux-android${API}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export PATH="$TOOLCHAIN/bin:$PATH"
          [ -x "$CC" ] || { echo "CC not found: $CC"; ls "$TOOLCHAIN/bin" | head -50; exit 1; }

          # CGO_ENABLED=1 让 Go 走系统 getaddrinfo（Android netd / VPN 动态 DNS），
          # 而不是纯 Go 解析器去读 /etc/resolv.conf（Android 上该文件不存在，
          # 导致 "lookup ... on [::1]:53: connection refused"）。
          # 不再使用 netgo / 纯静态解析，也不再写任何 hosts / resolv.conf。
          export CGO_ENABLED=1 GOOS=android GOARCH=arm64

          go build -trimpath -ldflags='-s -w' -o out/bin/wb2api     ./cmd/server
          go build -trimpath -ldflags='-s -w' -o out/bin/login      ./cmd/login
          go build -trimpath -ldflags='-s -w' -o out/bin/signin_bin ./cmd/signin
          go build -trimpath -ldflags='-s -w' -o out/bin/credit     ./cmd/credit

          echo "=== 校验：动态链接且依赖 libc（证明 CGO 生效）==="
          for f in out/bin/*; do
            echo "--- $f"
            file "$f"
            "$TOOLCHAIN/bin/llvm-readelf" -d "$f" | grep -i needed || {
              echo "ERROR: $f 未链接 libc，CGO 未生效"; exit 1; }
          done

      - name: Package Magisk ZIP
        id: package
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="dev-${GITHUB_SHA::7}"; fi
          STAGE="dist/workbuddy2api-magisk-arm64-${VERSION}"
          mkdir -p "$STAGE"
          cp -a magisk/. "$STAGE/"
          cp -a out/bin "$STAGE/bin"
          sed -i "s/^version=.*/version=${VERSION}/" "$STAGE/module.prop"
          sed -i "s/^versionCode=.*/versionCode=${GITHUB_RUN_NUMBER}/" "$STAGE/module.prop"
          (cd "$STAGE" && zip -qr "../workbuddy2api-magisk-arm64-${VERSION}.zip" .)
          sha256sum "dist/workbuddy2api-magisk-arm64-${VERSION}.zip" > "dist/workbuddy2api-magisk-arm64-${VERSION}.zip.sha256"
          echo "archive=dist/workbuddy2api-magisk-arm64-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: workbuddy2api-magisk-arm64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
